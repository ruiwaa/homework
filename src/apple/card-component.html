<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Card Component</title>
    <link rel="icon" href="./favicon/apple-favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon/apple-favicon.svg" />
    <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/card-component.css" />
  </head>
  <body>
    <!-- 카드 컴포넌트 -->

    <div class="apple-Products">
      <ul class="list">
        <li class="apple-items n-1">
          <h2>iPad Pro</h2>
          <p>놀라우리만치 얇다.</p>
          <p class="line-2">엄청나게 강력하다.</p>
          <p class="date">출시일 추후 공개</p>
          <a href="/">
            <button type="button" class="button button-fill">더 알아보기</button>
          </a>
          <a href="/">
            <button type="button" class="button button-outline">가격보기</button>
          </a>
        </li>
        <li class="apple-items n-2">
          <h2>iPad air</h2>
          <p>두 가지 사이즈. 더 빠른 칩.</p>
          <p class="line-2">무엇이든 거뜬하게.</p>
          <p class="date">출시일 추후 공개</p>
          <a href="/">
            <button type="button" class="button button-fill">더 알아보기</button>
          </a>
          <a href="/">
            <button type="button" class="button button-outline">가격보기</button>
          </a>
        </li>
      </ul>
